# Keep the standalone `staticcheck ./...` run (make staticcheck) in step
# with the staticcheck linter golangci-lint runs. golangci reads its check
# list and its exclusions from .golangci.yml, which staticcheck never
# sees, so the two runs disagree on the same tree unless the choices made
# there are repeated here.
#
# ST1000 (package comments) and ST1003 (naming conventions) are switched
# off in .golangci.yml's staticcheck settings.
#
# SA1019 reports deprecated usage. aws-sdk-go v1 marked its whole module
# surface deprecated, so every import in the AWS backends and their tests
# reports, drowning the deprecations that are actually actionable. The v2
# migration is its own piece of work; .golangci.yml excludes "SA1019:"
# for the same reason.
checks = ["all", "-ST1000", "-ST1003", "-SA1019"]
