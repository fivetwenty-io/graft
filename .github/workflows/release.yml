name: Release

# Publish a GitHub Release with cross-platform binaries whenever a
# semver tag (v1.2.3) is pushed. GoReleaser builds the matrix, archives
# each target, generates SHA256SUMS, signs + notarizes the darwin
# binaries, uploads everything to the release, and pushes the Homebrew
# cask to fivetwenty-io/homebrew-tap. Tests must pass before anything
# ships.
on:
  push:
    tags:
      - 'v*'

# Read-only by default; only the goreleaser job elevates to
# contents: write (creating the Release and uploading assets).
permissions:
  contents: read

# Self-hosted lab runners host four jobs per VM on eight cores. Go sizes
# its build parallelism from the host core count, so each job fans out as
# if it owned the machine and four of them together exhaust the VM's
# memory. Runner-level env does not cross into container jobs; workflow
# env is part of the job context, which the runner does carry in.
env:
  GOMAXPROCS: 2

jobs:
  # The self-hosted runner host is intentionally minimal (no make, no
  # compilers), so both jobs run in a golang container; the host only
  # needs docker. Actions are pinned to full commit SHAs (tags are
  # movable, and these jobs execute on a lab runner); Dependabot's
  # github-actions ecosystem keeps the pins current.
  #
  # The Go module and build caches are host directories bind-mounted into
  # both containers, and setup-go's own cache is off: on this persistent
  # runner the Actions cache service costs more than it saves and untars
  # over Go's read-only module cache. GOCACHE is set explicitly because the
  # runner overrides HOME to /github/home inside the container. Same
  # arrangement as ci.yml, which documents it at length.
  test:
    name: Test
    runs-on: self-hosted
    container:
      image: golang:1.27
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build
    env:
      GOCACHE: /root/.cache/go-build
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checkout despite mixed file owners
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      # The tag supplies the version goreleaser stamps into the release
      # binaries, but a build without that stamp (`go install`, `go build`)
      # falls back to `var Version` in cmd/graft/main.go, and the CHANGELOG
      # is what users read. v1.39.0 shipped with both still naming 1.38.0;
      # this refuses the tag instead. `make test-short` also pins the
      # baseline against the CHANGELOG (TestVersionMatchesChangelog); only
      # the tag comparison needs the workflow.
      - name: Verify the tag matches the version baseline and changelog
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          baseline="$(sed -n 's/^var Version = "\([^"]*\)".*/\1/p' cmd/graft/main.go)"
          changelog="$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)"
          echo "tag=$tag baseline=$baseline changelog=$changelog"
          if [ "$tag" != "$baseline" ]; then
            echo "::error::cmd/graft/main.go's Version is $baseline, but the tag is $tag" >&2
            exit 1
          fi
          if [ "$tag" != "$changelog" ]; then
            echo "::error::the newest CHANGELOG.md section is $changelog, but the tag is $tag" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          # The mounted /go volume is the module cache; the action's own
          # cache would restore a second copy over it and fail on tar.
          cache: false

      - name: Verify dependencies
        run: make deps

      - name: Vet
        run: go vet ./...

      # ci.yml only runs on pushes to main and on pull requests, so a tag
      # push would otherwise publish binaries that no workflow ever tested.
      - name: Run tests
        run: make test-short

  goreleaser:
    name: GoReleaser
    runs-on: self-hosted
    container:
      image: golang:1.27
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build
    env:
      GOCACHE: /root/.cache/go-build
    timeout-minutes: 60
    needs: test
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags for changelog generation
          persist-credentials: false

      - name: Trust the checkout despite mixed file owners
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          # The mounted /go volume is the module cache; the action's own
          # cache would restore a second copy over it and fail on tar.
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Exact, not '~> v2': a floating minor is a moving dependency on a
          # tag push, where there is no chance to catch a regression first.
          # v2.18.0 added a config validation that failed the v1.39.0 release
          # outright, with nothing in this repo having changed. Bump this pin
          # deliberately, with a release to verify it against.
          version: 'v2.18.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the Homebrew cask to fivetwenty-io/homebrew-tap; the
          # default GITHUB_TOKEN cannot write to another repo. Optional —
          # homebrew_casks.skip_upload degrades gracefully when this secret
          # is unset (an empty env value evaluates falsy in the goreleaser
          # template, so the tap push is skipped rather than failing).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # Apple code signing + notarization for the darwin binaries.
          # Optional — notarize.macos.enabled degrades gracefully when
          # MACOS_SIGN_P12 is unset, same pattern as the tap token above.
          # MACOS_SIGN_P12: base64 of the Developer ID Application .p12
          # (cert + key + Apple chain); MACOS_NOTARY_KEY: base64 of the
          # App Store Connect API .p8 key.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # The cask push degrades gracefully when HOMEBREW_TAP_GITHUB_TOKEN is
      # unset, which also makes it silent: a vanished or broken secret would
      # leave this run green while the tap keeps serving the previous
      # version. On the canonical repo the cask must always ship, so fail
      # the release unless the tap's cask advertises this tag's version.
      # Forks (which lack the tap secret by design) skip this check.
      - name: Verify tap cask version
        if: github.repository == 'fivetwenty-io/graft'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # curl instead of gh: the golang job container has no gh CLI.
        run: |
          expected="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            published=$(curl -sf \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/fivetwenty-io/homebrew-tap/contents/Casks/graft.rb" \
              | sed -n 's/^[[:space:]]*version "\(.*\)"/\1/p')
            if [ "$published" = "$expected" ]; then
              echo "tap cask is at ${published}"
              exit 0
            fi
            echo "attempt ${attempt}: tap cask at '${published:-<none>}', want '${expected}'"
            sleep 15
          done
          echo "tap cask never reached ${expected}" >&2
          exit 1
