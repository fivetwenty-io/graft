name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The Makefile derives VERSION from `git describe --tags
          # --exact-match`, which needs the tag objects present.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Verify dependencies
        run: make deps

      # ci.yml only runs on pushes to main and on pull requests, so a tag push
      # would otherwise publish binaries that no workflow ever tested.
      - name: Run tests
        run: make test-short

      - name: Build release artifacts
        run: make package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            build/graft-*.tar.gz \
            build/graft-*.zip \
            build/graft-*-checksums.sha256
