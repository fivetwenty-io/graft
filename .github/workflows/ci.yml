name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      # Pinned to a v2 release built with a Go toolchain at least as new
      # as go.mod's language version -- "latest" under the v6 action
      # resolved a v1.x linter built with go1.24, which refuses to load
      # against a go 1.26 target.
      #
      # The tree is clean under this config, so the whole config is
      # enforced -- there is no baseline left to grandfather in.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run unit tests
        run: make test-unit

      - name: Run race detector tests
        run: make test-race

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Verify dependencies
        run: make deps

      - name: Build binary
        run: make build

  import-validation:
    name: Validate External Imports
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run import validation tests
        run: make validate-imports

      - name: Run import validation example
        run: make validate-imports-example

  spruce-compat:
    name: Spruce Compat
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Add GOPATH/bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Best-effort: installs spruce so the golden-output and operator
      # parity suites can run for real instead of skipping. A failure
      # here (network, upstream repo issue, etc.) must not fail the job
      # -- both suites already skip cleanly when no spruce binary is on
      # PATH, and the vaultinfo pipefail suite needs only graft.
      - name: Install spruce (best-effort)
        run: go install github.com/geofffranks/spruce/cmd/spruce@latest
        continue-on-error: true

      - name: Run spruce/graft parity suite
        run: make test-spruce-compat
