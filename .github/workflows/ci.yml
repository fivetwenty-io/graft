name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One self-hosted runner serializes every job, so a superseded PR run
# would keep the queue busy long after its result stopped mattering.
# Cancel it when new commits arrive; never cancel main-branch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Self-hosted lab runners host four jobs per VM on eight cores. Go sizes
# its build parallelism from the host core count, so each job fans out as
# if it owned the machine and four of them together exhaust the VM's
# memory. Runner-level env does not cross into container jobs; workflow
# env is part of the job context, which the runner does carry in.
env:
  GOMAXPROCS: 2

jobs:
  # Every job runs in a golang container: the self-hosted runner host is
  # intentionally minimal, and mixing host jobs with container jobs
  # leaves the shared workspace with files owned by two different uids
  # (host runner user vs container root), which breaks checkout cleanup
  # and trips git's dubious-ownership guard.
  #
  # The "Trust the checkout" step writes safe.directory at --system
  # level (/etc/gitconfig): the checkout action writes it under its own
  # HOME, which shell steps in the container do not share, so git run by
  # go build's VCS stamping or by scripts would otherwise exit 128 on
  # the runner-user-owned .git.
  #
  # Actions are pinned to full commit SHAs (tags are movable, and these
  # jobs execute on a lab runner); Dependabot's github-actions ecosystem
  # keeps the pins current. persist-credentials is off everywhere: no
  # job pushes, and the workspace persists between jobs on this runner.
  #
  # timeout-minutes on every job: a hung job would otherwise hold the
  # single runner for GitHub's 6-hour default.
  #
  # The Go module and build caches are host directories bind-mounted into
  # each container rather than the Actions cache service. The container
  # filesystem is fresh every job, but this runner is persistent: fetching
  # and unpacking a multi-GB cache.tzst costs more than the build it saves,
  # and it untars over Go's read-only module cache, flooding the log with
  # tar "Cannot open: File exists". setup-go's own cache stays off for the
  # same reason. The mounts live outside _work, so the runner's workspace
  # reclaim hook leaves them alone and root ownership there is harmless.
  # GOCACHE is set explicitly because the runner overrides HOME to
  # /github/home inside the container -- inside _work/_temp, wiped between
  # jobs and outside the mount.
  lint:
    name: Lint
    runs-on: self-hosted
    container:
      image: golang:1.27
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build
    env:
      GOCACHE: /root/.cache/go-build
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the checkout despite mixed file owners
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          # The mounted /go volume is the module cache; the action's own
          # cache would restore a second copy over it and fail on tar.
          cache: false

      # The pinned release must be built with a Go toolchain at least as
      # new as the container's: golangci-lint parses the standard library
      # with its own go/types, and one built against an older toolchain
      # panics on "file requires newer Go version". v2.12.2 (built with
      # go1.26.2) died that way once the containers moved to 1.27; v2.13.1
      # is built with go1.27.0. Bump this in lockstep with the image.
      #
      # The tree is clean under this config, so the whole config is
      # enforced -- there is no baseline left to grandfather in.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  test:
    name: Test
    runs-on: self-hosted
    container:
      image: golang:1.27
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build
    env:
      GOCACHE: /root/.cache/go-build
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the checkout despite mixed file owners
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          # The mounted /go volume is the module cache; the action's own
          # cache would restore a second copy over it and fail on tar.
          cache: false

      - name: Run unit tests
        run: make test-unit

      - name: Run race detector tests
        run: make test-race

  build:
    name: Build
    runs-on: self-hosted
    container:
      image: golang:1.27
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build
    env:
      GOCACHE: /root/.cache/go-build
    timeout-minutes: 30
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the checkout despite mixed file owners
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          # The mounted /go volume is the module cache; the action's own
          # cache would restore a second copy over it and fail on tar.
          cache: false

      - name: Verify dependencies
        run: make deps

      - name: Build binary
        run: make build

  import-validation:
    name: Validate External Imports
    runs-on: self-hosted
    container:
      image: golang:1.27
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build
    env:
      GOCACHE: /root/.cache/go-build
    timeout-minutes: 30
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the checkout despite mixed file owners
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          # The mounted /go volume is the module cache; the action's own
          # cache would restore a second copy over it and fail on tar.
          cache: false

      - name: Run import validation tests
        run: make validate-imports

      - name: Run import validation example
        run: make validate-imports-example

  byte-identity:
    name: Byte Identity
    runs-on: self-hosted
    container:
      image: golang:1.27
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build
    env:
      GOCACHE: /root/.cache/go-build
    timeout-minutes: 30
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checkout despite mixed file owners
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          # The mounted /go volume is the module cache; the action's own
          # cache would restore a second copy over it and fail on tar.
          cache: false

      - name: Build head binary
        run: go build -o "$RUNNER_TEMP/graft-head" ./cmd/graft

      # The PR base commit is the reference: every invocation shape in
      # the corpus must produce byte-identical stdout, stderr, and exit
      # codes across base and head. Intentional output changes must land
      # with their own justification and a corpus update.
      #
      # A self-hosted runner reuses its workspace, so a worktree left by
      # an earlier run must be removed before this one can be added.
      - name: Build base binary
        run: |
          git worktree remove --force "$RUNNER_TEMP/base-tree" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/base-tree"
          git worktree add "$RUNNER_TEMP/base-tree" "${{ github.event.pull_request.base.sha }}"
          cd "$RUNNER_TEMP/base-tree" && go build -o "$RUNNER_TEMP/graft-base" ./cmd/graft

      - name: Compare outputs
        run: ./scripts/byte-identity.sh "$RUNNER_TEMP/graft-base" "$RUNNER_TEMP/graft-head"

  cache-identity:
    name: Cache Identity
    runs-on: self-hosted
    container:
      image: golang:1.27
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build
    env:
      GOCACHE: /root/.cache/go-build
    timeout-minutes: 30
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the checkout despite mixed file owners
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          # The mounted /go volume is the module cache; the action's own
          # cache would restore a second copy over it and fail on tar.
          cache: false

      - name: Build binary
        run: go build -o "$RUNNER_TEMP/graft-head" ./cmd/graft

      # Every invocation shape in the corpus must produce byte-identical
      # stdout, stderr, and exit codes across cache-off, cache-on-cold,
      # and cache-on-warm runs: a cached result may only ever be a faster
      # route to the exact bytes a cache-off run produces.
      - name: Compare cache-off, cold, and warm outputs
        run: ./scripts/cache-identity.sh "$RUNNER_TEMP/graft-head"

  spruce-compat:
    name: Spruce Compat
    runs-on: self-hosted
    container:
      image: golang:1.27
      volumes:
        - /home/runner/gha-container-cache/go:/go
        - /home/runner/gha-container-cache/go-build:/root/.cache/go-build
    env:
      GOCACHE: /root/.cache/go-build
    timeout-minutes: 30
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the checkout despite mixed file owners
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          # The mounted /go volume is the module cache; the action's own
          # cache would restore a second copy over it and fail on tar.
          cache: false

      - name: Add GOPATH/bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Best-effort: installs spruce so the golden-output and operator
      # parity suites can run for real instead of skipping. A failure
      # here (network, upstream repo issue, etc.) must not fail the job
      # -- both suites already skip cleanly when no spruce binary is on
      # PATH, and the vaultinfo pipefail suite needs only graft.
      - name: Install spruce (best-effort)
        run: go install github.com/geofffranks/spruce/cmd/spruce@latest
        continue-on-error: true

      # The parity suite's canonicalizer (tests/spruce-compat/lib/canon.py)
      # needs PyYAML, which the golang container image does not ship.
      # Unlike the spruce install above this must NOT be best-effort:
      # without it every yaml-mode comparison errors rather than skips.
      - name: Install PyYAML for the canonicalizer
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-yaml

      - name: Run spruce/graft parity suite
        run: make test-spruce-compat

  security:
    name: Security Scan
    runs-on: self-hosted
    container: golang:1.27
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installed from the pinned release rather than via trivy-action:
      # the action's own installer resolves "latest" unless pinned twice,
      # and a plain binary drop keeps this job's moving parts visible.
      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.74.0

      # Gate on HIGH/CRITICAL so unfixable advisories (e.g. the
      # x/crypto/openpgp "unmaintained package" notice, severity
      # UNKNOWN, pulled in transitively and never called -- govulncheck
      # confirms) don't hold CI red with nothing to remediate.
      # Suppressions with justifications live in .trivyignore.
      - name: Scan repository
        run: >-
          trivy fs
          --scanners vuln,secret,misconfig
          --severity HIGH,CRITICAL
          --exit-code 1
          --skip-dirs .git
          .
