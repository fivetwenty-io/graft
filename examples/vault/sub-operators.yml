---
# Vault Path Construction Examples
#
# This file previously demonstrated a "paren () and bar | sub-operator"
# syntax for building vault paths (grouping and OR-choice directly
# inside the path string, e.g. `vault ("secret/" ("prod" | "dev") ":key")`).
# That syntax does not exist in the parser -- every one of those forms
# is a parse error ("expected ')' to close parenthesized expression",
# "expected ')', got (", etc). Requires: export VAULT_ADDR=..., export
# VAULT_TOKEN=... to see real (non-credential-error) results.
#
# The real ways to build a dynamic vault path are demonstrated below:
# string concatenation, and vault-try for ordered fallback across
# multiple paths.

meta:
  vault_path: "secret/myapp"
  stub: "prod"
  environment: "production"

env: prod

# Backwards-compatible, real syntax
backwards_compatible:
  basic: (( vault "secret/app:password" ))
  concat: (( vault "secret/" env "/app:password" ))
  with_default: (( vault "secret/app:password" || "default" ))
  nested_op: (( vault "secret/" (grab env) "/app:password" ))
  semicolon: (( vault "secret/app:password;secret/fallback:password" ))

# vault-try: the real way to attempt multiple paths in order and use
# the first one that resolves (see examples/vault-try/ for more)
vault_try_style:
  password: (( vault-try "secret/app:password" "secret/fallback:password" "default" ))

# Building a path dynamically with concat, then trying it with a
# shared fallback
dynamic_path:
  tenant: "customer1"
  tenant_secret: (( vault-try (concat "secret/tenants/" dynamic_path.tenant ":api_key") "secret/shared:default_api_key" ))
