# Sorting Named Entry Arrays
#
# Sorting arrays of maps/objects by specified keys
#
# Note: (( sort )) is a merge-phase marker, not a value-producing
# expression -- it has to be written at the SAME key an earlier merged
# document already defined as a list, and there is one sort per list
# (you cannot have five differently-sorted copies of one list under five
# different key names). Each sort variant below therefore gets its own
# copy of the source list under its own name. Run this file together
# with named-entries-overrides.yml:
#   graft merge named-entries.yml named-entries-overrides.yml

# Default sorting by 'name' key
default_sort:
  # Services list - will sort by 'name' automatically
  services:
    - name: database
      port: 5432
      priority: 1
    - name: cache
      port: 6379
      priority: 3
    - name: web
      port: 8080
      priority: 2
    - name: api
      port: 8081
      priority: 2
  # Result: Sorted alphabetically by name: api, cache, database, web

# Sorting by custom keys
custom_key_sort:
  # Sort by 'id' instead of name
  by_id:
    - id: "item-003"
      name: "Third Item"
      value: 300
    - id: "item-001"
      name: "First Item"
      value: 100
    - id: "item-004"
      name: "Fourth Item"
      value: 400
    - id: "item-002"
      name: "Second Item"
      value: 200
  # Result: Sorted by id: item-001, item-002, item-003, item-004

  # Sort by numeric value (same entries, own copy so it can carry a
  # different sort key)
  by_value:
    - id: "item-003"
      name: "Third Item"
      value: 300
    - id: "item-001"
      name: "First Item"
      value: 100
    - id: "item-004"
      name: "Fourth Item"
      value: 400
    - id: "item-002"
      name: "Second Item"
      value: 200
  # Result: Sorted by value: 100, 200, 300, 400

# User management example
users:
  # Each key below is its own copy of the user list, sorted by a
  # different field
  by_name:
    - name: charlie
      email: charlie@example.com
      role: admin
      created: "2023-01-15"
      last_login: "2024-01-14"
    - name: alice
      email: alice@example.com
      role: user
      created: "2023-03-20"
      last_login: "2024-01-15"
    - name: bob
      email: bob@example.com
      role: moderator
      created: "2023-02-10"
      last_login: "2024-01-13"
    - name: david
      email: david@example.com
      role: user
      created: "2023-04-05"
      last_login: "2024-01-10"
  # Default: alice, bob, charlie, david

  by_email:
    - name: charlie
      email: charlie@example.com
    - name: alice
      email: alice@example.com
    - name: bob
      email: bob@example.com
    - name: david
      email: david@example.com
  # Sort by email address

  by_role:
    - name: charlie
      role: admin
    - name: alice
      role: user
    - name: bob
      role: moderator
    - name: david
      role: user
  # Sort by role: admin, moderator, user, user

  by_created:
    - name: charlie
      created: "2023-01-15"
    - name: alice
      created: "2023-03-20"
    - name: bob
      created: "2023-02-10"
    - name: david
      created: "2023-04-05"
  # Sort by creation date

  by_last_login:
    - name: charlie
      last_login: "2024-01-14"
    - name: alice
      last_login: "2024-01-15"
    - name: bob
      last_login: "2024-01-13"
    - name: david
      last_login: "2024-01-10"
  # Sort by last login

# Server inventory
servers:
  by_name:
    - name: prod-web-01
      ip: "10.0.1.10"
      cpu: 8
      memory: 32
      datacenter: "us-east-1"
    - name: prod-db-01
      ip: "10.0.2.10"
      cpu: 16
      memory: 64
      datacenter: "us-east-1"
    - name: prod-cache-01
      ip: "10.0.3.10"
      cpu: 4
      memory: 16
      datacenter: "us-west-2"
    - name: prod-app-01
      ip: "10.0.1.20"
      cpu: 8
      memory: 32
      datacenter: "us-east-1"
  # Alphabetical by server name

  by_ip:
    - name: prod-web-01
      ip: "10.0.1.10"
    - name: prod-db-01
      ip: "10.0.2.10"
    - name: prod-cache-01
      ip: "10.0.3.10"
    - name: prod-app-01
      ip: "10.0.1.20"
  # Sort by IP address (string sort)

  by_cpu:
    - name: prod-web-01
      cpu: 8
    - name: prod-db-01
      cpu: 16
    - name: prod-cache-01
      cpu: 4
    - name: prod-app-01
      cpu: 8
  # Sort by CPU count

  by_memory:
    - name: prod-web-01
      memory: 32
    - name: prod-db-01
      memory: 64
    - name: prod-cache-01
      memory: 16
    - name: prod-app-01
      memory: 32
  # Sort by memory size

  by_datacenter:
    - name: prod-web-01
      datacenter: "us-east-1"
    - name: prod-db-01
      datacenter: "us-east-1"
    - name: prod-cache-01
      datacenter: "us-west-2"
    - name: prod-app-01
      datacenter: "us-east-1"
  # Group by datacenter

# Application configurations
applications:
  sorted_by_name:
    - name: frontend
      version: "2.1.0"
      replicas: 5
      port: 3000
    - name: backend
      version: "3.0.1"
      replicas: 3
      port: 8080
    - name: worker
      version: "1.5.2"
      replicas: 2
      port: 9090
    - name: scheduler
      version: "1.0.0"
      replicas: 1
      port: 8090

  sorted_by_version:
    - name: frontend
      version: "2.1.0"
    - name: backend
      version: "3.0.1"
    - name: worker
      version: "1.5.2"
    - name: scheduler
      version: "1.0.0"

  sorted_by_replicas:
    - name: frontend
      replicas: 5
    - name: backend
      replicas: 3
    - name: worker
      replicas: 2
    - name: scheduler
      replicas: 1

  sorted_by_port:
    - name: frontend
      port: 3000
    - name: backend
      port: 8080
    - name: worker
      port: 9090
    - name: scheduler
      port: 8090

# Cloud resources
cloud_resources:
  by_name:
    - name: "web-instance-1"
      type: "t3.medium"
      cost: 0.0416
      region: "us-east-1"
    - name: "db-instance-1"
      type: "r5.large"
      cost: 0.126
      region: "us-east-1"
    - name: "cache-instance-1"
      type: "t3.small"
      cost: 0.0208
      region: "us-west-2"
    - name: "app-instance-1"
      type: "t3.large"
      cost: 0.0832
      region: "us-east-1"

  by_type:
    - name: "web-instance-1"
      type: "t3.medium"
    - name: "db-instance-1"
      type: "r5.large"
    - name: "cache-instance-1"
      type: "t3.small"
    - name: "app-instance-1"
      type: "t3.large"

  by_cost:
    - name: "web-instance-1"
      cost: 0.0416
    - name: "db-instance-1"
      cost: 0.126
    - name: "cache-instance-1"
      cost: 0.0208
    - name: "app-instance-1"
      cost: 0.0832
  # Numeric sort

  by_region:
    - name: "web-instance-1"
      region: "us-east-1"
    - name: "db-instance-1"
      region: "us-east-1"
    - name: "cache-instance-1"
      region: "us-west-2"
    - name: "app-instance-1"
      region: "us-east-1"

# Task priority queue
tasks:
  by_priority:
    - name: "backup-database"
      priority: 1
    - name: "update-cache"
      priority: 3
    - name: "generate-reports"
      priority: 2
    - name: "cleanup-logs"
      priority: 4
  # Highest priority first (1, 2, 3, 4)

  by_scheduled:
    - name: "backup-database"
      scheduled: "2024-01-15T02:00:00Z"
    - name: "update-cache"
      scheduled: "2024-01-15T00:00:00Z"
    - name: "generate-reports"
      scheduled: "2024-01-15T06:00:00Z"
    - name: "cleanup-logs"
      scheduled: "2024-01-15T03:00:00Z"
  # Chronological order

  by_duration:
    - name: "backup-database"
      duration: 3600
    - name: "update-cache"
      duration: 300
    - name: "generate-reports"
      duration: 1800
    - name: "cleanup-logs"
      duration: 600
  # Shortest to longest

# API endpoints
api_endpoints:
  by_name:
    - name: "users"
      path: "/api/v1/users"
      method: "GET"
      rate_limit: 1000
    - name: "auth"
      path: "/api/v1/auth"
      method: "POST"
      rate_limit: 100
    - name: "products"
      path: "/api/v1/products"
      method: "GET"
      rate_limit: 5000
    - name: "orders"
      path: "/api/v1/orders"
      method: "POST"
      rate_limit: 500

  by_path:
    - name: "users"
      path: "/api/v1/users"
    - name: "auth"
      path: "/api/v1/auth"
    - name: "products"
      path: "/api/v1/products"
    - name: "orders"
      path: "/api/v1/orders"

  by_method:
    - name: "users"
      method: "GET"
    - name: "auth"
      method: "POST"
    - name: "products"
      method: "GET"
    - name: "orders"
      method: "POST"

  by_rate_limit:
    - name: "users"
      rate_limit: 1000
    - name: "auth"
      rate_limit: 100
    - name: "products"
      rate_limit: 5000
    - name: "orders"
      rate_limit: 500

