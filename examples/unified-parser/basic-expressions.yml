# Basic Expression Examples for Unified Parser
#
# Only currently-supported syntax is exercised below. Several forms that
# do not exist in the parser have been removed, each noted at its
# original spot: grab:nocache / vault@target:ttl=N modifiers,
# function-call syntax with commas (concat("a","b")), bracket string
# indexing (config["database"]["host"]), inline map/array literals, and
# $VAR embedded mid-dotted-path.

config:
  database:
    host: localhost
    port: 5432
count: 3
enabled: true
environment: prod
retries: 2
users:
  - name: alice
prefix: app
suffix: service
base_value: 5
multiplier: 3
offset: 1
user:
  name: World
  message: hello

# Simple operator calls
simple_grab: (( grab config.database.host ))
simple_concat: (( concat "Hello" " " "World" ))

# Arithmetic expressions with proper precedence
math_basic: (( calc "2 + 3 * 4" )) # 14, not 20
math_parentheses: (( calc "(2 + 3) * 4" )) # 20

# Comparison and logical operators
comparison: (( count > 5 ))
logical_and: (( enabled && count > 0 ))
logical_or: (( grab primary_host || "localhost" ))

# Ternary expressions
conditional: '(( environment == "prod" ? "production-db" : "dev-db" ))'
complex_ternary: '(( retries > 10 ? "error" : retries < 5 ? "warning" : "ok" ))'

# Reference paths with array indexing
#
# Note: config["database"]["host"] (bracket string-index chaining)
# does not resolve; use dotted access instead.
array_access: (( grab users.0.name ))
map_access: (( grab config.database.host ))

# Operator calls with targets
#
# Note: `grab:nocache` and `vault@target:ttl=N` colon modifiers are not
# real syntax ("expected '))' at end of operator expression, got :").
# vault_with_target: (( vault@production "secret/database" ))

# Function-style operator calls
#
# Note: comma-separated function-call args (concat(a, b)) do not parse;
# space-separated bare-call args do.
function_style: (( concat "a" "b" ))

# Nested operator calls
nested_grab: (( concat (grab prefix || "app") "-" (grab suffix || "service") ))
nested_arithmetic: (( calc (grab base_value || 10) * (grab multiplier || 2) + (grab offset || 0) ))

# Escaped strings and special characters
escaped_string: '(( concat "Message: \"" (grab user.message) "\"" ))'
unicode_string: (( concat "Hello " (grab user.name || "世界") ))
