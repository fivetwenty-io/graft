---
# Encoding credentials and authentication data
# Run with: USERNAME=myuser PASSWORD=mypass graft merge credentials.yml

meta:
  username: (( grab $USERNAME || "admin" ))
  password: (( grab $PASSWORD || "changeme" ))
  api_key: "sk-1234567890abcdef"
  
# Basic authentication
basic_auth:
  # Encode username:password for HTTP Basic Auth
  credentials: (( base64 (concat (grab meta.username) ":" (grab meta.password)) ))
  
  # Complete Authorization header
  header: (( concat "Basic " (grab basic_auth.credentials) ))
  
  # For use in HTTP requests
  curl_example: (( concat "curl -H 'Authorization: " (grab basic_auth.header) "' https://api.example.com" ))

# API key encoding
api_auth:
  # Some APIs expect base64 encoded keys
  encoded_key: (( base64 (grab meta.api_key) ))
  
  # Custom header format
  x_api_key: (( concat "Bearer " (base64 (grab meta.api_key)) ))

# Database connection strings
database:
  host: db.example.com
  port: 5432
  name: myapp
  
  # Encode sensitive parts
  encoded_password: (( base64 (grab meta.password) ))
  
  # Some systems expect base64 encoded connection strings
  connection_string: (( concat 
    "postgresql://" 
    (grab meta.username) 
    ":" 
    (grab meta.password) 
    "@" 
    (grab database.host) 
    ":" 
    (grab database.port) 
    "/" 
    (grab database.name) 
  ))
  encoded_connection: (( base64 (grab database.connection_string) ))

# Service account credentials
service_account:
  # Simulate a service account JSON
  json: (( concat 
    "{" 
    "\"type\": \"service_account\", " 
    "\"client_email\": \"" (grab meta.username) "@project.iam.gserviceaccount.com\", " 
    "\"private_key\": \"" (grab meta.api_key) "\"" 
    "}" 
  ))
  
  # Base64 encode for storage/transmission
  encoded: (( base64 (grab service_account.json) ))

# OAuth2 credentials
oauth2:
  client_id: "123456789.apps.googleusercontent.com"
  client_secret: (( grab meta.api_key ))
  
  # Some OAuth2 flows require base64 encoded client credentials
  basic_auth: (( base64 (concat (grab oauth2.client_id) ":" (grab oauth2.client_secret)) ))
  
  # Token request example
  token_request:
    authorization: (( concat "Basic " (grab oauth2.basic_auth) ))
    grant_type: "client_credentials"

# Docker registry authentication
docker:
  registry: "docker.io"
  
  # Docker config.json format
  auth_json: (( concat 
    "{\"username\": \"" 
    (grab meta.username) 
    "\", \"password\": \"" 
    (grab meta.password) 
    "\"}" 
  ))
  
  # Docker expects base64 encoded auth
  auth: (( base64 (grab docker.auth_json) ))
  
  # Complete docker config
  config_json:
    auths:
      docker.io:
        auth: (( grab docker.auth ))