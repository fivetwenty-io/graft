# Basic Complex YAML Defaults Example
# This demonstrates using hashes and arrays as default values
#
# Note: (( )) cannot construct a map/array literal inline (`{ ... }` /
# `[ ... ]` is a parse error as an operator argument), so each default
# value below is a named value that the fallback (( grab X || Y ))
# points at instead of an inline literal.

defaults:
  config:
    environment: "development"
    debug: true
    log_level: "info"
  cors_origins: ["http://localhost:3000", "http://localhost:8080"]
  database:
    host: "localhost"
    port: 5432
    name: "app_dev"
    pool:
      min: 2
      max: 10
      timeout: 5000
  api_service:
    url: "http://localhost:3001"
    timeout: 30
    retries: 3
  auth_service:
    url: "http://localhost:3002"
    timeout: 15
    retries: 5
  backend_services:
    - name: "primary"
      host: "backend1.local"
      port: 8080
      weight: 70
    - name: "secondary"
      host: "backend2.local"
      port: 8080
      weight: 30
  feature_flags:
    new_ui:
      enabled: false
      rollout_percentage: 0
    advanced_search:
      enabled: true
      rollout_percentage: 100
    beta_features:
      enabled: false
      allowed_users: []

application:
  # Use a hash as default for configuration
  config: (( grab custom_config || defaults.config ))

  # Use an array as default for allowed origins
  cors_origins: (( grab allowed_origins || defaults.cors_origins ))

  # Nested default structure
  database: (( grab db_config || defaults.database ))

# Service endpoints with defaults
services:
  api: (( grab api_service || defaults.api_service ))
  auth: (( grab auth_service || defaults.auth_service ))

  # Array of service definitions
  backends: (( grab backend_services || defaults.backend_services ))

# Feature flags with complex defaults
features:
  flags: (( grab feature_flags || defaults.feature_flags ))
