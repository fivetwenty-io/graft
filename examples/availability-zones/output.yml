instance_groups:
- azs:
  - z1
  - z2
  instances: 3
  name: staticIP
  networks:
  - name: net1
    static_ips:
    - 192.168.0.1
    - 192.168.2.3
    - 192.168.0.4
- azs:
  - z1
  instances: 3
  name: api
  networks:
  - name: net1
    static_ips:
    - 192.168.0.2
    - 192.168.0.5
    - 192.168.0.6
- instances: 3
  name: web
  networks:
  - name: net1
    static_ips:
    - 192.168.0.10
    - 192.168.2.1
    - 192.168.2.2
networks:
- name: net1
  subnets:
  - az: z1
    cloud_properties: random
    static:
    - "192.168.0.1 - 192.168.0.10"
  - az: z2
    cloud_properties: random
    static:
    - "192.168.2.1 - 192.168.2.10"
properties:
  api_servers:
  - 192.168.0.2
  - 192.168.0.5
  - 192.168.0.6
  staticIP_servers:
  - 192.168.0.1
  - 192.168.2.3
  - 192.168.0.4
  web_servers:
  - 192.168.0.10
  - 192.168.2.1
  - 192.168.2.2
