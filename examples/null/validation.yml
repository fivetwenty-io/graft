# Data Validation with Null Operator
#
# Using null checks to validate required fields and configurations

# User registration validation
user_registration:
  # Input data (some fields might be missing)
  input:
    username: "johndoe"
    email: "john@example.com"
    password: ""
    first_name: "John"
    last_name: null
    age: 25
    terms_accepted: true
    phone: ""
    address:
      street: ""
      city: "New York"
      state: "NY"
      zip: null
  
  # Validation rules
  validation:
    # Required field checks
    required:
      username: (( ! ((type user_registration.input.username == "null")) ))
      # Result: true (present)
      
      email: (( ! ((type user_registration.input.email == "null")) ))
      # Result: true (present)
      
      password: (( ! ((type user_registration.input.password == "null")) && ! (empty user_registration.input.password) ))
      # Result: false (empty string)
      
      first_name: (( ! ((type user_registration.input.first_name == "null")) ))
      # Result: true (present)
      
      last_name: (( ! ((type user_registration.input.last_name == "null")) ))
      # Result: false (null)
      
      terms_accepted: (( user_registration.input.terms_accepted ))
      # Result: true (must be true, not just non-null)
    
    # Optional field checks
    optional:
      has_phone: (( ! ((type user_registration.input.phone == "null")) && ! (empty user_registration.input.phone) ))
      # Result: false (empty)
      
      has_age: (( ! ((type user_registration.input.age == "null")) ))
      # Result: true (present)
      
      has_full_address: '(( ! ((type user_registration.input.address.street == "null")) && ! ((type user_registration.input.address.city == "null")) && ! ((type user_registration.input.address.state == "null")) && ! ((type user_registration.input.address.zip == "null")) ))'
      # Result: false (street and zip are null/empty)
    
    # Overall validation
    is_valid: '(( user_registration.validation.required.username && user_registration.validation.required.email && user_registration.validation.required.password && user_registration.validation.required.first_name && user_registration.validation.required.last_name && user_registration.validation.required.terms_accepted ))'
    # Result: false (password and last_name missing)
    
    # Error messages
    errors:
      - '(( (type user_registration.input.username == "null") ? "Username is required" : ~ ))'
      - '(( (type user_registration.input.email == "null") ? "Email is required" : ~ ))'
      - '(( (type user_registration.input.password == "null") ? "Password is required" : ~ ))'
      - '(( (type user_registration.input.first_name == "null") ? "First name is required" : ~ ))'
      - '(( (type user_registration.input.last_name == "null") ? "Last name is required" : ~ ))'
      - '(( ! user_registration.input.terms_accepted ? "Terms must be accepted" : ~ ))'

# API request validation
api_request:
  # Incoming request
  request:
    method: "POST"
    path: "/api/orders"
    headers:
      authorization: "Bearer abc123"
      content_type: "application/json"
      x_api_key: ""
    body:
      customer_id: "CUST-123"
      items: []
      shipping_address:
        street: "123 Main St"
        city: "Seattle"
        state: "WA"
        zip: "98101"
      billing_address: null
      payment_method:
        type: "credit_card"
        token: ""
  
  # Validation checks
  validation:
    # Header validation
    headers:
      has_auth: (( ! ((type api_request.request.headers.authorization == "null")) ))
      # Result: true
      
      has_api_key: (( ! ((type api_request.request.headers.x_api_key == "null")) && ! (empty api_request.request.headers.x_api_key) ))
      # Result: false (empty)
      
      valid_content_type: (( api_request.request.headers.content_type == "application/json" ))
      # Result: true
    
    # Body validation
    body:
      has_customer: (( ! ((type api_request.request.body.customer_id == "null")) ))
      # Result: true
      
      has_items: (( ! ((type api_request.request.body.items == "null")) && ! (empty api_request.request.body.items) ))
      # Result: false (empty array)
      
      has_shipping: (( ! ((type api_request.request.body.shipping_address == "null")) ))
      # Result: true
      
      has_billing: (( ! ((type api_request.request.body.billing_address == "null")) ))
      # Result: false (null)
      
      has_payment_token: (( ! ((type api_request.request.body.payment_method.token == "null")) && ! (empty api_request.request.body.payment_method.token) ))
      # Result: false (empty)
    
    # Conditional requirements
    requires_billing: (( api_request.request.body.payment_method.type == "credit_card" ))
    billing_valid: (( ! requires_billing || ! ((type api_request.request.body.billing_address == "null")) ))
    # Result: false (credit card requires billing address)
    
    # Overall request validation
    is_valid: '(( api_request.validation.headers.has_auth && api_request.validation.body.has_customer && api_request.validation.body.has_items && api_request.validation.body.has_shipping && api_request.validation.body.has_payment_token && api_request.validation.billing_valid ))'
    # Result: false
    
    # Response
    response:
      status: '(( api_request.validation.is_valid ? 200 : 400 ))'
      errors: 
        - '(( api_request.validation.body.has_items ? ~ : "Items cannot be empty" ))'
        - '(( api_request.validation.body.has_payment_token ? ~ : "Payment token is required" ))'
        - '(( api_request.validation.billing_valid ? ~ : "Billing address required for credit card" ))'

# Configuration file validation
config_validation:
  # Application configuration
  config:
    app:
      name: "MyService"
      version: "1.2.3"
      environment: ""
    
    database:
      host: "localhost"
      port: 5432
      name: "mydb"
      user: null
      password: null
    
    cache:
      enabled: true
      provider: ""
      ttl: null
    
    monitoring:
      enabled: true
      endpoints:
        metrics: "/metrics"
        health: ""
        ready: null
    
    features: []
  
  # Section validations
  validations:
    # App section
    app:
      valid_name: (( ! ((type config_validation.config.app.name == "null")) ))
      valid_version: (( ! ((type config_validation.config.app.version == "null")) ))
      valid_environment: (( ! ((type config_validation.config.app.environment == "null")) && ! (empty config_validation.config.app.environment) ))
      is_valid: (( config_validation.validations.app.valid_name && config_validation.validations.app.valid_version && config_validation.validations.app.valid_environment ))
      # Result: false (environment is empty)
    
    # Database section
    database:
      valid_host: (( ! ((type config_validation.config.database.host == "null")) ))
      valid_port: (( ! ((type config_validation.config.database.port == "null")) ))
      valid_name: (( ! ((type config_validation.config.database.name == "null")) ))
      valid_credentials: '(( ! ((type config_validation.config.database.user == "null")) && ! ((type config_validation.config.database.password == "null")) ))'
      is_valid: (( config_validation.validations.database.valid_host && config_validation.validations.database.valid_port && config_validation.validations.database.valid_name && config_validation.validations.database.valid_credentials ))
      # Result: false (missing credentials)
    
    # Cache section (optional but if enabled, must be configured)
    cache:
      is_configured: '(( ! config_validation.config.cache.enabled || (! ((type config_validation.config.cache.provider == "null")) && ! ((type config_validation.config.cache.ttl == "null"))) ))'
      # Result: false (enabled but missing provider and ttl)
    
    # Monitoring section
    monitoring:
      all_endpoints_defined: '(( ! config_validation.config.monitoring.enabled || (! ((type config_validation.config.monitoring.endpoints.metrics == "null")) && ! ((type config_validation.config.monitoring.endpoints.health == "null")) && ! ((type config_validation.config.monitoring.endpoints.ready == "null"))) ))'
      # Result: false (enabled but missing some endpoints)
    
    # Overall validation
    all_valid: '(( config_validation.validations.app.is_valid && config_validation.validations.database.is_valid && config_validation.validations.cache.is_configured && config_validation.validations.monitoring.all_endpoints_defined ))'
    # Result: false
    
    # Validation report
    report:
      valid: (( config_validation.validations.all_valid ))
      sections:
        app: '(( config_validation.validations.app.is_valid ? "OK" : "Invalid: missing environment" ))'
        database: '(( config_validation.validations.database.is_valid ? "OK" : "Invalid: missing credentials" ))'
        cache: '(( config_validation.validations.cache.is_configured ? "OK" : "Invalid: missing configuration" ))'
        monitoring: '(( config_validation.validations.monitoring.all_endpoints_defined ? "OK" : "Invalid: missing endpoints" ))'

# Form validation with complex rules
form_validation:
  # Form input
  form_data:
    personal:
      title: "Mr"
      first_name: "John"
      middle_name: ""
      last_name: "Doe"
      date_of_birth: "1990-01-01"
      ssn: null
    
    contact:
      email: "john@example.com"
      phone: "+1-555-1234"
      alt_phone: ""
      preferred_contact: "email"
    
    employment:
      status: "employed"
      employer: ""
      job_title: null
      annual_income: 75000
      start_date: ""
    
    preferences:
      newsletter: true
      sms_alerts: false
      notifications: null
  
  # Validation rules based on other fields
  rules:
    # Personal info
    personal:
      has_full_name: '(( ! ((type form_validation.form_data.personal.first_name == "null")) && ! ((type form_validation.form_data.personal.last_name == "null")) ))'
      # Result: true
      
      has_ssn: (( ! ((type form_validation.form_data.personal.ssn == "null")) ))
      # Result: false
    
    # Contact validation
    contact:
      has_primary_contact: '(( ! ((type form_validation.form_data.contact.email == "null")) || ! ((type form_validation.form_data.contact.phone == "null")) ))'
      # Result: true
      
      preferred_contact_valid: '(( (form_validation.form_data.contact.preferred_contact == "email" && ! ((type form_validation.form_data.contact.email == "null"))) || (form_validation.form_data.contact.preferred_contact == "phone" && ! ((type form_validation.form_data.contact.phone == "null"))) ))'
      # Result: true
    
    # Employment validation (conditional)
    employment:
      # If employed, employer and job title required
      valid_if_employed: '(( form_validation.form_data.employment.status != "employed" || (! ((type form_validation.form_data.employment.employer == "null")) && ! ((type form_validation.form_data.employment.job_title == "null")) && ! ((type form_validation.form_data.employment.start_date == "null"))) ))'
      # Result: false (employed but missing required fields)
      
      # Income required for certain statuses
      income_required: '(( form_validation.form_data.employment.status == "employed" || form_validation.form_data.employment.status == "self-employed" ))'
      has_income: (( ! ((type form_validation.form_data.employment.annual_income == "null")) ))
      income_valid: (( ! (form_validation.rules.employment.income_required && ! form_validation.rules.employment.has_income) ))
      # Result: true
    
    # Preferences (at least one notification method if subscribed)
    preferences:
      notification_method_selected: '(( ! form_validation.form_data.preferences.newsletter || form_validation.form_data.preferences.sms_alerts || ! ((type form_validation.form_data.preferences.notifications == "null")) ))'
      # Result: false (newsletter true but no notification method)
  
  # Final validation
  validation_summary:
    sections:
      personal: (( form_validation.rules.personal.has_full_name ))
      contact: (( form_validation.rules.contact.has_primary_contact && form_validation.rules.contact.preferred_contact_valid ))
      employment: (( form_validation.rules.employment.valid_if_employed && form_validation.rules.employment.income_valid ))
      preferences: (( form_validation.rules.preferences.notification_method_selected ))
    
    all_valid: '(( form_validation.validation_summary.sections.personal && form_validation.validation_summary.sections.contact && form_validation.validation_summary.sections.employment && form_validation.validation_summary.sections.preferences ))'
    # Result: false
    
    errors:
      - '(( form_validation.rules.employment.valid_if_employed ? ~ : "Employment details incomplete" ))'
      - '(( form_validation.rules.preferences.notification_method_selected ? ~ : "Select notification preference" ))'