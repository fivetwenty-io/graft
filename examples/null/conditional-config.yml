# Conditional Configuration with Null Operator
#
# Using null checks to conditionally enable features and resources

# Application configuration with optional features
application:
  name: "MyApp"
  version: "1.2.3"
  
  # Optional configurations (some may be null/empty)
  features:
    analytics:
      enabled: true
      tracking_id: "UA-123456-1"
    
    cache:
      enabled: true
      provider: ""  # Empty - should use default
    
    cdn:
      enabled: false
      url: null
    
    monitoring:
      # Completely missing - should be detected as null
  
  # Feature flags based on null checks
  feature_flags:
    has_analytics: (( ! ((type application.features.analytics.tracking_id == "null")) ))
    # Result: true (tracking_id is present)
    
    has_cache_provider: (( ! ((type application.features.cache.provider == "null")) && ! (empty application.features.cache.provider) ))
    # Result: false (provider is empty string)
    
    has_cdn_url: (( ! ((type application.features.cdn.url == "null")) ))
    # Result: false (url is null)
    
    has_monitoring: (( ! ((type application.features.monitoring == "null")) ))
    # Result: false (monitoring doesn't exist)

# Database configuration with optional read replicas
database:
  primary:
    host: "db-master.example.com"
    port: 5432
    username: "appuser"
    password: "secretpass"
  
  # Optional read replicas
  replicas: []  # Empty array
  
  # Connection pooling (optional)
  pool:
    min: null
    max: null
  
  # SSL configuration (optional)
  ssl:
    enabled: true
    cert: ""
  
  # Configuration decisions based on null checks
  config:
    use_replicas: (( ! ((type database.replicas == "null")) && ! (empty database.replicas) ))
    # Result: false (empty array)
    
    has_pool_config: (( ! ((type database.pool.min == "null")) || ! ((type database.pool.max == "null")) ))
    # Result: false (both are null)
    
    ssl_fully_configured: (( database.ssl.enabled && ! ((type database.ssl.cert == "null")) && ! (empty database.ssl.cert) ))
    # Result: false (cert is empty)

    # Note: + is arithmetic only (concat does string concatenation), and
    # a multi-argument bare call (concat here) can't take a
    # parenthesized-call argument that itself has a nested parenthesized
    # call, so the SSL query string is computed as its own named value.
    ssl_query: '(( (type database.ssl.cert == "null") ? "" : (concat "?sslcert=" database.ssl.cert) ))'
    connection_string: '(( concat "postgresql://" database.primary.username ":" database.primary.password "@" database.primary.host ":" database.primary.port "/myapp" database.config.ssl_query ))'

# Service discovery with optional endpoints
services:
  api:
    internal: "http://api.internal:8080"
    external: "https://api.example.com"
  
  auth:
    internal: "http://auth.internal:8080"
    external: null  # No external endpoint
  
  cache:
    internal: ""  # Empty - no internal endpoint
    external: "redis://cache.example.com:6379"
  
  # Service availability checks
  availability:
    api:
      has_internal: (( ! ((type services.api.internal == "null")) ))
      # Result: true
      has_external: (( ! ((type services.api.external == "null")) ))
      # Result: true
      fully_available: (( ! ((type services.api.internal == "null")) && ! ((type services.api.external == "null")) ))
      # Result: true
    
    auth:
      has_internal: (( ! ((type services.auth.internal == "null")) ))
      # Result: true
      has_external: (( ! ((type services.auth.external == "null")) ))
      # Result: false
      fully_available: (( ! ((type services.auth.internal == "null")) && ! ((type services.auth.external == "null")) ))
      # Result: false
    
    cache:
      has_internal: (( ! ((type services.cache.internal == "null")) && ! (empty services.cache.internal) ))
      # Result: false
      has_external: (( ! ((type services.cache.external == "null")) ))
      # Result: true
      fully_available: (( ! ((type services.cache.internal == "null")) && ! (empty services.cache.internal) && ! ((type services.cache.external == "null")) ))
      # Result: false

# Cloud resource configuration
cloud:
  # Optional auto-scaling configuration
  autoscaling:
    enabled: true
    min: 2
    max: null  # Not configured
    target_cpu: 80
  
  # Optional load balancer
  load_balancer:
    enabled: false
    type: ""
    certificate_arn: null
  
  # Optional CDN
  cdn: {}  # Empty map
  
  # Resource creation flags
  resources:
    create_autoscaling: (( cloud.autoscaling.enabled && ! ((type cloud.autoscaling.max == "null")) ))
    # Result: false (max is null)
    
    create_load_balancer: '(( cloud.load_balancer.enabled && ! ((type cloud.load_balancer.type == "null")) && ! ((type cloud.load_balancer.certificate_arn == "null")) ))'
    # Result: false (multiple nulls)
    
    create_cdn: (( ! ((type cloud.cdn == "null")) && ! (empty cloud.cdn) ))
    # Result: false (empty map)

# Kubernetes deployment with optional resources
kubernetes:
  deployment:
    name: "myapp"
    replicas: 3
    
    # Optional resource limits
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: null  # No limit
        cpu: ""      # Empty - no limit
    
    # Optional probes
    probes:
      liveness:
        path: "/health"
        port: 8080
      readiness:
        # Completely missing
    
    # Optional environment variables
    env:
      - name: "APP_ENV"
        value: "production"
      - name: "LOG_LEVEL"
        value: ""  # Empty - should use default
      - name: "FEATURE_FLAG"
        value: null
  
  # Deployment configuration based on null checks
  config:
    has_memory_limit: (( ! ((type kubernetes.deployment.resources.limits.memory == "null")) ))
    # Result: false
    
    has_cpu_limit: (( ! ((type kubernetes.deployment.resources.limits.cpu == "null")) && ! (empty kubernetes.deployment.resources.limits.cpu) ))
    # Result: false
    
    has_readiness_probe: (( ! ((type kubernetes.deployment.probes.readiness == "null")) ))
    # Result: false
    
    # Note: there is no array-filter/list-comprehension operator (the
    # `| [[ ... ]]` form used here previously never parsed), so each
    # entry's null-ness is checked individually instead of filtering the
    # list down to only the valid entries.
    env_var_checks:
      app_env_set: (( ! ((type kubernetes.deployment.env.[0].value == "null")) ))
      # Result: true
      log_level_set: (( ! ((type kubernetes.deployment.env.[1].value == "null")) ))
      # Result: true (empty string, not null)
      feature_flag_set: (( ! ((type kubernetes.deployment.env.[2].value == "null")) ))
      # Result: false (null)

# Feature toggles with complex conditions
feature_toggles:
  # Source configurations (some might be missing)
  configs:
    beta_users: ["user1", "user2"]
    premium_features: null
    experimental: {}
    maintenance_mode: false
  
  # Feature decisions
  features:
    enable_beta: (( ! ((type feature_toggles.configs.beta_users == "null")) && ! (empty feature_toggles.configs.beta_users) ))
    # Result: true (has beta users)
    
    enable_premium: (( ! ((type feature_toggles.configs.premium_features == "null")) ))
    # Result: false (premium_features is null)
    
    enable_experimental: (( ! ((type feature_toggles.configs.experimental == "null")) && ! (empty feature_toggles.configs.experimental) ))
    # Result: false (empty map)
    
    system_available: (( ! feature_toggles.configs.maintenance_mode ))
    # Result: true (not in maintenance)

# Conditional resource creation
resources:
  # Optional S3 bucket
  #
  # cloud.cdn is {}, so bucket_name is a genuinely absent key (not just
  # null) and needs a grab fallback to avoid an unresolved-path error.
  s3_bucket:
    create: (( ! ((type (grab cloud.cdn.bucket_name || ~) == "null")) ))
    name: '(( (type (grab cloud.cdn.bucket_name || ~) == "null") ? "" : cloud.cdn.bucket_name ))'

  # Optional RDS instance
  #
  # Note: there is no array .length accessor or count/size operator, so
  # this reports whether replicas exist rather than how many.
  rds_instance:
    create: (( ! ((type database.replicas == "null")) && ! (empty database.replicas) ))
    has_read_replicas: (( ! (empty database.replicas) ))
  
  # Optional ElastiCache
  elasticache:
    create: (( ! ((type services.cache.internal == "null")) ))
    endpoint: '(( (type services.cache.internal == "null") ? services.cache.external : services.cache.internal ))'