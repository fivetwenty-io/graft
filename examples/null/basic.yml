# Basic Null Operator Examples
#
# Demonstrates the basic usage of the null operator
#
# Note: the one-argument form (( null X )) does not parse — the
# tokenizer reads bare `null` as the nil literal, not the operator name,
# so `(( null X ))` errors with "expected '))' ... got IDENTIFIER". Only
# the zero-argument form (( null )) (which returns nil) works. This file
# uses the working equivalent (( type X == "null" )) instead, which also
# matches the operator's real semantics: only an actual nil value counts
# as null. Empty string/array/map are NOT null.
#
# References that do not exist at all still error ("could not be found
# in the datastructure") rather than resolving to nil, so an undefined-key
# check needs a `grab X || ~` fallback first.

# Testing different types of null values
null_checks:
  # Actual null/nil values
  explicit_null: null
  is_null: (( (type null_checks.explicit_null == "null") ))
  # Result: true

  yaml_null: ~
  is_yaml_null: (( (type null_checks.yaml_null == "null") ))
  # Result: true

  # Empty values (NOT null under strict nil semantics)
  empty_string: ""
  is_empty_string: (( (type null_checks.empty_string == "null") ))
  # Result: false

  empty_array: []
  is_empty_array: (( (type null_checks.empty_array == "null") ))
  # Result: false

  empty_map: {}
  is_empty_map: (( (type null_checks.empty_map == "null") ))
  # Result: false

  # Non-existent references (need a fallback to avoid an unresolved-path error)
  is_undefined: (( (type (grab null_checks.non_existent_key || ~) == "null") ))
  # Result: true

  # Non-null values
  string_value: "hello"
  is_string_null: (( (type null_checks.string_value == "null") ))
  # Result: false

  zero: 0
  is_zero_null: (( (type null_checks.zero == "null") ))
  # Result: false

  false_value: false
  is_false_null: (( (type null_checks.false_value == "null") ))
  # Result: false

  array_with_items: [1, 2, 3]
  is_array_null: (( (type null_checks.array_with_items == "null") ))
  # Result: false

  map_with_keys:
    key: value
  is_map_null: (( (type null_checks.map_with_keys == "null") ))
  # Result: false

  # Space is not empty
  space_string: " "
  is_space_null: (( (type null_checks.space_string == "null") ))
  # Result: false

# Nested null checks
nested_data:
  level1:
    level2:
      value: null
      data: ""
    level2_exists:
      value: "present"

  # Check nested nulls
  checks:
    nested_null: (( (type nested_data.level1.level2.value == "null") ))
    # Result: true

    nested_empty: (( (type nested_data.level1.level2.data == "null") ))
    # Result: false (empty string, not null)

    nested_exists: (( (type nested_data.level1.level2_exists.value == "null") ))
    # Result: false

    deep_undefined: (( (type (grab nested_data.level1.level2.level3.level4 || ~) == "null") ))
    # Result: true

# Arrays with null elements
array_nulls:
  mixed_array:
    - "first"
    - null
    - ""
    - []
    - "last"

  # Check individual elements
  element_checks:
    first: (( (type array_nulls.mixed_array.[0] == "null") ))
    # Result: false

    second: (( (type array_nulls.mixed_array.[1] == "null") ))
    # Result: true

    third: (( (type array_nulls.mixed_array.[2] == "null") ))
    # Result: false (empty string, not null)

    fourth: (( (type array_nulls.mixed_array.[3] == "null") ))
    # Result: false (empty array, not null)

    fifth: (( (type array_nulls.mixed_array.[4] == "null") ))
    # Result: false

# Common patterns
patterns:
  # Check multiple conditions
  config:
    database_url: ""
    api_key: null
    debug_mode: false

  # All null checks
  missing_config:
    no_database: (( (type patterns.config.database_url == "null") ))
    # Result: false (empty string, not null)

    no_api_key: (( (type patterns.config.api_key == "null") ))
    # Result: true

    no_debug: (( (type patterns.config.debug_mode == "null") ))
    # Result: false (false is not null)

  # Combined checks
  #
  # Note: || is graft's fallback operator, not boolean OR — it returns the
  # left operand whenever the left operand resolves, even to false. Real
  # OR needs De Morgan's law: (A || B) == !(!A && !B).
  any_missing: (( ! (type patterns.config.database_url != "null" && type patterns.config.api_key != "null") ))
  # Result: true (api_key is null)

  all_present: (( ! ((type patterns.config.database_url == "null")) && ! ((type patterns.config.api_key == "null")) ))
  # Result: false (api_key is null)

# Edge cases
edge_cases:
  # Numbers
  zero_int: 0
  zero_float: 0.0
  zero_checks:
    int_null: (( (type edge_cases.zero_int == "null") ))
    # Result: false
    float_null: (( (type edge_cases.zero_float == "null") ))
    # Result: false

  # Booleans
  true_val: true
  false_val: false
  bool_checks:
    true_null: (( (type edge_cases.true_val == "null") ))
    # Result: false
    false_null: (( (type edge_cases.false_val == "null") ))
    # Result: false

  # Special strings
  special_strings:
    null_string: "null"
    nil_string: "nil"
    none_string: "none"
  string_checks:
    null_str: (( (type edge_cases.special_strings.null_string == "null") ))
    # Result: false (string "null" is not null)
    nil_str: (( (type edge_cases.special_strings.nil_string == "null") ))
    # Result: false
    none_str: (( (type edge_cases.special_strings.none_string == "null") ))
    # Result: false

# Grab with null checks
references:
  source:
    present: "value"
    empty: ""
    missing: null

  # Safe references with null checks
  safe_refs:
    has_present: (( ! ((type references.source.present == "null")) ))
    # Result: true

    has_empty: (( ! ((type references.source.empty == "null")) ))
    # Result: true (empty string is not null)

    has_missing: (( ! ((type references.source.missing == "null")) ))
    # Result: false

    has_undefined: (( ! ((type (grab references.source.undefined || ~) == "null")) ))
    # Result: false
