# Default Values with Null Operator
#
# Using null checks to provide default values for missing configuration

# Application defaults
app_config:
  # User-provided config (some values might be null/empty)
  provided:
    name: "MyApp"
    version: ""
    environment: null
    port: 8080
    host: ""
    timeout: null
    max_connections: 100
    log_level: ""
    features:
      analytics: true
      caching: null
      compression: false
  
  # Default values
  defaults:
    name: "DefaultApp"
    version: "0.0.1"
    environment: "development"
    port: 3000
    host: "localhost"
    timeout: 30
    max_connections: 50
    log_level: "info"
    features:
      analytics: false
      caching: true
      compression: true
  
  # Final configuration with defaults
  final:
    name: '(( (type app_config.provided.name == "null") ? app_config.defaults.name : app_config.provided.name ))'
    # Result: "MyApp"
    
    version: '(( (type app_config.provided.version == "null") ? app_config.defaults.version : app_config.provided.version ))'
    # Result: "0.0.1" (empty string is null)
    
    environment: '(( (type app_config.provided.environment == "null") ? app_config.defaults.environment : app_config.provided.environment ))'
    # Result: "development" (null value)
    
    port: '(( (type app_config.provided.port == "null") ? app_config.defaults.port : app_config.provided.port ))'
    # Result: 8080 (not null)
    
    host: '(( (type app_config.provided.host == "null") ? app_config.defaults.host : app_config.provided.host ))'
    # Result: "localhost" (empty string)
    
    timeout: '(( (type app_config.provided.timeout == "null") ? app_config.defaults.timeout : app_config.provided.timeout ))'
    # Result: 30 (null value)
    
    max_connections: '(( (type app_config.provided.max_connections == "null") ? app_config.defaults.max_connections : app_config.provided.max_connections ))'
    # Result: 100 (not null)
    
    log_level: '(( (type app_config.provided.log_level == "null") ? app_config.defaults.log_level : app_config.provided.log_level ))'
    # Result: "info" (empty string)
    
    features:
      analytics: '(( (type app_config.provided.features.analytics == "null") ? app_config.defaults.features.analytics : app_config.provided.features.analytics ))'
      # Result: true
      
      caching: '(( (type app_config.provided.features.caching == "null") ? app_config.defaults.features.caching : app_config.provided.features.caching ))'
      # Result: true (null value gets default)
      
      compression: '(( (type app_config.provided.features.compression == "null") ? app_config.defaults.features.compression : app_config.provided.features.compression ))'
      # Result: false (provided value, even though false)

# Database configuration with defaults
database_config:
  # Partial user configuration
  user_config:
    host: "db.example.com"
    port: null
    username: "appuser"
    password: ""
    database: "myapp"
    options:
      ssl: true
      pool_size: null
      timeout: ""
  
  # System defaults
  defaults:
    host: "localhost"
    port: 5432
    username: "postgres"
    password: "postgres"
    database: "postgres"
    options:
      ssl: false
      pool_size: 10
      timeout: "30s"
      charset: "utf8"
      timezone: "UTC"
  
  # Merged configuration
  connection:
    host: '(( (type database_config.user_config.host == "null") ? database_config.defaults.host : database_config.user_config.host ))'
    port: '(( (type database_config.user_config.port == "null") ? database_config.defaults.port : database_config.user_config.port ))'
    username: '(( (type database_config.user_config.username == "null") ? database_config.defaults.username : database_config.user_config.username ))'
    password: '(( (type database_config.user_config.password == "null") ? database_config.defaults.password : database_config.user_config.password ))'
    database: '(( (type database_config.user_config.database == "null") ? database_config.defaults.database : database_config.user_config.database ))'
    
    # Options with nested defaults
    options:
      ssl: '(( (type database_config.user_config.options.ssl == "null") ? database_config.defaults.options.ssl : database_config.user_config.options.ssl ))'
      pool_size: '(( (type database_config.user_config.options.pool_size == "null") ? database_config.defaults.options.pool_size : database_config.user_config.options.pool_size ))'
      timeout: '(( (type database_config.user_config.options.timeout == "null") ? database_config.defaults.options.timeout : database_config.user_config.options.timeout ))'
      # User didn't provide these at all - use defaults
      charset: '(( (type (grab database_config.user_config.options.charset || ~) == "null") ? database_config.defaults.options.charset : database_config.user_config.options.charset ))'
      timezone: '(( (type (grab database_config.user_config.options.timezone || ~) == "null") ? database_config.defaults.options.timezone : database_config.user_config.options.timezone ))'

# Cloud provider configuration
cloud_config:
  # User might provide partial config
  provided:
    provider: "aws"
    region: ""
    credentials:
      access_key: null
      secret_key: null
    instance:
      type: "t3.medium"
      ami: ""
      security_groups: []
      subnet: null
  
  # Environment-based defaults
  environment: "production"
  
  defaults:
    development:
      region: "us-west-2"
      instance:
        type: "t3.micro"
        ami: "ami-dev12345"
        security_groups: ["sg-dev"]
        subnet: "subnet-dev"
    
    production:
      region: "us-east-1"
      instance:
        type: "t3.large"
        ami: "ami-prod12345"
        security_groups: ["sg-prod-web", "sg-prod-app"]
        subnet: "subnet-prod"
  
  # Get defaults for current environment
  env_defaults: (( grab cloud_config.defaults.[cloud_config.environment] ))
  
  # Final configuration
  final:
    provider: (( cloud_config.provided.provider )) # Always use provided
    region: '(( (type cloud_config.provided.region == "null") ? cloud_config.env_defaults.region : cloud_config.provided.region ))'
    
    credentials:
      # Use environment variables if not provided
      access_key: '(( (type cloud_config.provided.credentials.access_key == "null") ? "$AWS_ACCESS_KEY_ID" : cloud_config.provided.credentials.access_key ))'
      secret_key: '(( (type cloud_config.provided.credentials.secret_key == "null") ? "$AWS_SECRET_ACCESS_KEY" : cloud_config.provided.credentials.secret_key ))'
    
    instance:
      type: '(( (type cloud_config.provided.instance.type == "null") ? cloud_config.env_defaults.instance.type : cloud_config.provided.instance.type ))'
      ami: '(( (type cloud_config.provided.instance.ami == "null") ? cloud_config.env_defaults.instance.ami : cloud_config.provided.instance.ami ))'
      # No inline array-literal comparison, and no more than one level of
      # nested (( )) calls, so the "null or empty" check is split into
      # two named helpers and combined without further nesting.
      _sg_is_null: (( type cloud_config.provided.instance.security_groups == "null" ))
      _sg_is_empty: (( empty cloud_config.provided.instance.security_groups ))
      security_groups: '(( ! (! cloud_config.final.instance._sg_is_null && ! cloud_config.final.instance._sg_is_empty) ? cloud_config.env_defaults.instance.security_groups : cloud_config.provided.instance.security_groups ))'
      subnet: '(( (type cloud_config.provided.instance.subnet == "null") ? cloud_config.env_defaults.instance.subnet : cloud_config.provided.instance.subnet ))'

# Service endpoints with fallbacks
services:
  # User configuration (might be incomplete)
  configured:
    api:
      url: "https://api.example.com"
      timeout: null
    auth:
      url: ""
      timeout: 10
    metrics:
      # Completely missing
  
  # Default service configurations
  defaults:
    api:
      url: "http://localhost:8080"
      timeout: 30
      retry: 3
    auth:
      url: "http://localhost:8081"
      timeout: 20
      retry: 2
    metrics:
      url: "http://localhost:9090"
      timeout: 5
      retry: 1
  
  # Build final service map
  endpoints:
    api:
      url: '(( (type services.configured.api.url == "null") ? services.defaults.api.url : services.configured.api.url ))'
      timeout: '(( (type services.configured.api.timeout == "null") ? services.defaults.api.timeout : services.configured.api.timeout ))'
      retry: '(( (type (grab services.configured.api.retry || ~) == "null") ? services.defaults.api.retry : services.configured.api.retry ))'
    
    auth:
      url: '(( (type services.configured.auth.url == "null") ? services.defaults.auth.url : services.configured.auth.url ))'
      timeout: '(( (type services.configured.auth.timeout == "null") ? services.defaults.auth.timeout : services.configured.auth.timeout ))'
      retry: '(( (type (grab services.configured.auth.retry || ~) == "null") ? services.defaults.auth.retry : services.configured.auth.retry ))'
    
    metrics:
      url: '(( (type (grab services.configured.metrics.url || ~) == "null") ? services.defaults.metrics.url : services.configured.metrics.url ))'
      timeout: '(( (type (grab services.configured.metrics.timeout || ~) == "null") ? services.defaults.metrics.timeout : services.configured.metrics.timeout ))'
      retry: '(( (type (grab services.configured.metrics.retry || ~) == "null") ? services.defaults.metrics.retry : services.configured.metrics.retry ))'

# List defaults with null checking
list_configs:
  # User might provide partial lists
  user_lists:
    allowed_origins: ["https://app.example.com"]
    blocked_ips: []
    rate_limits: null
    feature_flags: ["feature1", "feature2"]
  
  # Default lists
  default_lists:
    allowed_origins: ["http://localhost:3000", "http://localhost:8080"]
    blocked_ips: ["0.0.0.0", "255.255.255.255"]
    rate_limits: [100, 1000, 10000]
    feature_flags: ["basic", "standard"]
  
  # Merge lists with defaults
  #
  # No inline array-literal comparison, and no more than one level of
  # nested (( )) calls, so each "null or empty" check is split into two
  # named helpers and combined without further nesting.
  _origins_is_null: (( type list_configs.user_lists.allowed_origins == "null" ))
  _origins_is_empty: (( empty list_configs.user_lists.allowed_origins ))
  _ips_is_null: (( type list_configs.user_lists.blocked_ips == "null" ))
  _ips_is_empty: (( empty list_configs.user_lists.blocked_ips ))
  final_lists:
    # Use user list if not empty, otherwise defaults
    allowed_origins: '(( ! (! list_configs._origins_is_null && ! list_configs._origins_is_empty) ? list_configs.default_lists.allowed_origins : list_configs.user_lists.allowed_origins ))'

    # Empty array - use defaults
    blocked_ips: '(( ! (! list_configs._ips_is_null && ! list_configs._ips_is_empty) ? list_configs.default_lists.blocked_ips : list_configs.user_lists.blocked_ips ))'

    # Null - use defaults
    rate_limits: '(( (type list_configs.user_lists.rate_limits == "null") ? list_configs.default_lists.rate_limits : list_configs.user_lists.rate_limits ))'

    # Note: concat is string concatenation only, and there is no
    # array-merge operator, so this picks the user list when non-empty
    # rather than concatenating the two lists.
    feature_flags: '(( ! (empty list_configs.user_lists.feature_flags) ? list_configs.user_lists.feature_flags : list_configs.default_lists.feature_flags ))'

# Complex nested defaults
nested_config:
  # Sparse user configuration
  user:
    server:
      http:
        port: 8080
      https:
        # Missing entirely
    client:
      timeout: null
      retries: 3
    logging:
      level: ""
      outputs: []
  
  # Complete defaults
  defaults:
    server:
      http:
        port: 80
        host: "0.0.0.0"
      https:
        port: 443
        host: "0.0.0.0"
        cert: "/etc/ssl/cert.pem"
        key: "/etc/ssl/key.pem"
    client:
      timeout: 30
      retries: 5
      backoff: "exponential"
    logging:
      level: "info"
      outputs: ["stdout", "file"]
      format: "json"
  
  # Build complete configuration
  complete:
    server:
      http:
        port: '(( (type nested_config.user.server.http.port == "null") ? nested_config.defaults.server.http.port : nested_config.user.server.http.port ))'
        host: '(( (type (grab nested_config.user.server.http.host || ~) == "null") ? nested_config.defaults.server.http.host : nested_config.user.server.http.host ))'
      https:
        port: '(( (type (grab nested_config.user.server.https.port || ~) == "null") ? nested_config.defaults.server.https.port : nested_config.user.server.https.port ))'
        host: '(( (type (grab nested_config.user.server.https.host || ~) == "null") ? nested_config.defaults.server.https.host : nested_config.user.server.https.host ))'
        cert: '(( (type (grab nested_config.user.server.https.cert || ~) == "null") ? nested_config.defaults.server.https.cert : nested_config.user.server.https.cert ))'
        key: '(( (type (grab nested_config.user.server.https.key || ~) == "null") ? nested_config.defaults.server.https.key : nested_config.user.server.https.key ))'
    client:
      timeout: '(( (type nested_config.user.client.timeout == "null") ? nested_config.defaults.client.timeout : nested_config.user.client.timeout ))'
      retries: '(( (type nested_config.user.client.retries == "null") ? nested_config.defaults.client.retries : nested_config.user.client.retries ))'
      backoff: '(( (type (grab nested_config.user.client.backoff || ~) == "null") ? nested_config.defaults.client.backoff : nested_config.user.client.backoff ))'
    logging:
      level: '(( (type nested_config.user.logging.level == "null") ? nested_config.defaults.logging.level : nested_config.user.logging.level ))'
      # No inline array-literal comparison, and no more than one level of
      # nested (( )) calls, so the "null or empty" check is split into
      # two named helpers and combined without further nesting.
      _outputs_is_null: (( type nested_config.user.logging.outputs == "null" ))
      _outputs_is_empty: (( empty nested_config.user.logging.outputs ))
      outputs: '(( ! (! nested_config.complete.logging._outputs_is_null && ! nested_config.complete.logging._outputs_is_empty) ? nested_config.defaults.logging.outputs : nested_config.user.logging.outputs ))'
      format: '(( (type (grab nested_config.user.logging.format || ~) == "null") ? nested_config.defaults.logging.format : nested_config.user.logging.format ))'