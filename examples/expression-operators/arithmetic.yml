# Arithmetic Operations Example
# Demonstrates the new arithmetic operators in Graft

# Basic values for calculations
values:
  base_price: 100
  tax_rate: 0.08
  discount_percent: 15
  quantity: 3

# Simple arithmetic
calculations:
  # Addition
  subtotal: (( values.base_price * values.quantity ))
  tax_amount: (( calculations.subtotal * values.tax_rate ))
  total_with_tax: (( calculations.subtotal + calculations.tax_amount ))
  
  # Using parentheses for clarity
  total_alt: (( values.base_price * values.quantity * (1 + values.tax_rate) ))
  
  # Subtraction  
  discount_amount: (( calculations.subtotal * (values.discount_percent / 100) ))
  final_price: (( calculations.total_with_tax - calculations.discount_amount ))
  
  # Division and modulo
  #
  # Note: % requires integer operands; final_price is a float here, so
  # this floors it first with calc.
  price_per_item: (( calculations.final_price / values.quantity ))
  final_price_int: (( calc "floor(final_price)" ))
  remainder: (( calculations.final_price_int % 10 ))

# String concatenation with arithmetic
#
# Note: + is arithmetic only; use concat for strings.
summary:
  message: '(( concat "Total: $" calculations.final_price ))'
  items: '(( concat values.quantity " items at $" values.base_price " each" ))'

# Mixed type arithmetic
mixed_types:
  int_plus_float: (( 10 + 2.5 )) # 12.5
  # Note: arithmetic operators do not coerce numeric strings; "42" stays
  # a string and errors in `*`. Use a real number, or concat for display.
  concatenation: '(( concat "Result: " 100 ))' # "Result: 100"