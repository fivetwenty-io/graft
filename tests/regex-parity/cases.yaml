# The regex parity corpus. Each case names its flavor, its pattern, its jq
# flag letters, and its subject, and tests/regex-parity/want/<id>.json holds
# what jq 1.8.2's match printed for it, or for a PCRE case what pcre2test
# 10.49 found, written the same way. tests/regex-parity/gen.sh records the
# goldens. Every value but an id or a flavor is a JSON string.
#
# An Oniguruma case avoids a global match that can be empty on a subject
# with multibyte runes, because jq moves past an empty match one byte at a
# time where this package moves one rune. A PCRE case's subject holds
# neither \x{ nor <unset>, which pcre2test's output would make ambiguous.
#
# The corpus leaves out the departures pkg/regex/doc.go lists, such as \uhhhh,
# which the PCRE flavor reads as a code point where PCRE2 refuses it.

