# golangci-lint configuration for graft
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  formats:
    text:
      path: stdout
      colors: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/fivetwenty-io/graft

linters:
  default: none
  enable:
    # Default linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended for production libraries
    - bodyclose
    - dogsled
    - dupl
    - errorlint
    - exhaustive
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    - unconvert
    - unparam
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    govet:
      enable-all: true
      disable:
        - fieldalignment  # Too strict for general use
        # Every hit is `err` redeclared by a `:=` inside a loop or an if,
        # then checked on the next line. That is how Go reads, and the
        # check has no way to tell it apart from the outer value being
        # lost.
        - shadow

    gocyclo:
      min-complexity: 15

    goconst:
      min-len: 3
      min-occurrences: 3
      # Tests are already exempt from the report below, so counting their
      # literals only inflates production sites into findings: a single
      # return in a String() method looks repeated because a dozen tests
      # assert on the word it returns.
      ignore-tests: true
      # graft implements a language, so a large part of its string
      # literals are that language's vocabulary and repeat by
      # definition: once in the table that declares a word, and again in
      # every switch that dispatches on it. Naming each word as a
      # constant renames the grammar without making any of those sites
      # safer, so the vocabulary is listed here instead. Anything not on
      # this list is still reported.
      #
      # Covered: operator and merge-directive names, control-flow
      # keywords and their aliases, YAML literal spellings, the type
      # names used in type-switch dispatch, the field names graft
      # searches to identify a list entry, and the REPL/CLI command
      # names.
      ignore-string-values: "^(?:grab|concat|join|defer|param|prune|inject|stringify|parse|static|static_ips|ips|vault|vault-try|openbao|awsparam|awssm|awssecret|nats|file|env|calc|cartesian|cartesian-product|empty|keys|values|sort|uniq|reverse|shuffle|min|max|sum|length|base64|base64-decode|negate|key-sorter|substr|split|flatten|trim|upper|lower|merge|index|first|last|replace|insert|delete|append|prepend|inline|load|none|this|if|elif|elsif|else|fi|endif|for|endfor|in|done|while|endwhile|case|endcase|when|default|esac|on|before|after|range|and|or|not|step|continue|breaks|config|output|diff|quit|graft|name|id|key|true|false|null|nil|yes|no|off|---|True|False|Null|Nil|Yes|No|On|Off|TRUE|FALSE|NULL|NIL|YES|NO|ON|OFF|EOF|NaN|-Inf|mod|string|int|int64|float|float64|bool|map|array|type)$"

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - whyNoLint  # Allow nolint without explanation in some cases
        - hugeParam  # Value receivers on small data types are fine for immutability
        - unnamedResult  # Named results add visual noise for simple functions
        - paramTypeCombine  # Style preference only
        - commentedOutCode  # Sometimes commented code serves as documentation
        - appendCombine  # Minor optimization, can reduce clarity
        - docStub  # Allow placeholder docs during development
        - appendAssign  # False positives for intentional patterns
        - typeDefFirst  # Organization preference
        - ifElseChain  # Some if-else chains with loop breaks cannot be switched

    gosec:
      excludes:
        - G104  # Unhandled errors (covered by errcheck)
        - G304  # File path injection (intentional for file operator)

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      for-loops: true

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
          exclude:
            - "**/*_test.go"
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: superfluous-else
        - name: unreachable-code

    staticcheck:
      checks:
        - all
        - -ST1000  # Package comments
        - -ST1003  # Naming conventions

  exclusions:
    rules:
      # Allow dot imports for goconvey in tests
      - path: _test\.go$
        linters:
          - revive
        text: "dot-imports"

      # Allow longer functions in test files
      - path: _test\.go
        linters:
          - gocyclo

      # Allow magic numbers in tests
      - path: _test\.go
        linters:
          - goconst

      # A test fetch function that never fails still has to return an
      # error: its signature is fixed by the caching/dedup API it is
      # handed to, not by what this particular test does inside it.
      - path: _test\.go
        linters:
          - unparam
        text: 'result \d+ \(error\) is always nil'

      # Tests collect a handful of names or errors to assert on, and
      # several build the slice up a literal element at a time to exercise
      # a growing value. Sizing those allocations says nothing about the
      # code under test.
      - path: _test\.go
        linters:
          - prealloc

      # Test-case tables and the documentation examples are fixture data:
      # the repeated strings are the category labels and sample values a
      # reader is meant to see spelled out.
      - path: (unified_parser_test_cases|examples)\.go
        linters:
          - goconst
      - path: examples/
        linters:
          - goconst

      # Exclude some staticcheck rules for legacy code patterns
      - linters:
          - staticcheck
        text: "SA1019:"  # Deprecated usage (can be addressed gradually)

      # Allow unchecked errors in examples
      - path: examples/
        linters:
          - errcheck

      # Credential-shaped literals in tests are fixture data: fake vault
      # paths, dummy tokens, and the secret keys the operators are asked to
      # resolve. None of them reach a real backend.
      - path: _test\.go
        linters:
          - gosec
        text: "G101"

      # Tests exec the graft binary they just built, with a path the test
      # itself constructs.
      - path: _test\.go
        linters:
          - gosec
        text: "G204"

      # Unchecked type assertions in tests. A failed assertion panics with
      # the exact file:line, which is already an unambiguous test failure,
      # and the tests navigate deeply nested YAML documents where a comma-ok
      # check per hop would bury the assertion being made. Error-returning
      # calls in tests stay checked, and non-test code keeps
      # check-type-assertions.
      - path: _test\.go
        linters:
          - errcheck
        text: "Error return value is not checked"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
